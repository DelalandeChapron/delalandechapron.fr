# Déploiement Netlify de delalandechapron.fr
# Site statique sans étape de build : on publie la racine du repo telle quelle.

[build]
  publish = "."
  # Pas de build : pas de commande. (laissé vide volontairement)
  command = ""

# ---------------------------------------------------------------------------
# L'icône est déclarée dans le HTML sous /favicons/, mais beaucoup d'outils
# (agrégateurs, robots, anciens navigateurs) demandent /favicon.ico à la racine
# et récoltaient un 404. Réécriture en 200 plutôt que copie du fichier, pour
# ne pas avoir deux exemplaires à maintenir.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/favicon.ico"
  to = "/favicons/favicon.ico"
  status = 200

# ---------------------------------------------------------------------------
# Une seule URL vivante par page. Netlify réécrit les liens du HTML vers la
# forme sans extension, mais servait aussi la forme en .html en 200 : deux URLs
# pour un même contenu. On tranche par une redirection permanente vers la forme
# sans extension, celle que portent les liens et les canoniques.
# (404.html est volontairement absent de cette liste : Netlify s'en sert comme
#  page d'erreur, le rediriger la casserait.)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/mentions-legales.html"
  to = "/mentions-legales"
  status = 301

[[redirects]]
  from = "/merci.html"
  to = "/merci"
  status = 301

# ---------------------------------------------------------------------------
# En-têtes de cache — repris à l'identique de l'ancien .htaccess Apache
# ---------------------------------------------------------------------------

# Images : 1 an, immuable (noms de fichiers stables)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Polices auto-hébergées : 1 an, immuable
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicons : 1 an
[[headers]]
  for = "/favicons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML : 1 heure (revalidation rapide pour que les mises à jour sortent vite)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Racine (servie comme index.html) : même politique que le HTML
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------------------
# En-têtes de sécurité
#
# La CSP est désormais possible : depuis la réécriture, la page ne charge plus
# aucune ressource externe (polices auto-hébergées, images locales, zéro script
# tiers). Seul 'unsafe-inline' pour les styles reste nécessaire, le CSS étant
# embarqué dans la page. Le JSON-LD n'a pas besoin d'être autorisé : son type
# n'étant pas exécutable, il n'est pas soumis à script-src.
# form-action 'self' suffit : le formulaire Netlify poste sur sa propre URL.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Permissions-Policy = "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
